<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Geografia: Colonização das Américas</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e0f2fe, #bae6fd);
            margin: 0;
            padding: 20px;
            color: #1e2937;
        }
        .container {
            max-width: 700px;
            margin: 40px auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        header {
            background: #0ea5e9;
            color: white;
            padding: 25px;
            text-align: center;
        }
        .qr-container {
            text-align: center;
            margin: 15px 0 25px 0;
        }
        .qr-container p {
            margin: 8px 0 12px 0;
            color: #64748b;
        }
        /* resto do estilo permanece igual */
        .quiz-area { padding: 30px; }
        .progress { text-align: center; margin-bottom: 20px; font-size: 16px; color: #64748b; }
        .question { font-size: 22px; margin-bottom: 30px; line-height: 1.4; }
        .options { display: flex; flex-direction: column; gap: 12px; }
        button {
            padding: 16px 20px;
            font-size: 18px;
            border: 2px solid #e2e8f0;
            background: white;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }
        button:hover { background: #f1f5f9; border-color: #0ea5e9; }
        button.selected { background: #bae6fd; border-color: #0ea5e9; }
        .next-btn {
            margin-top: 30px;
            width: 100%;
            padding: 16px;
            background: #0ea5e9;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            cursor: pointer;
        }
        .result { text-align: center; padding: 40px 30px; }
        .score { font-size: 48px; font-weight: bold; color: #0ea5e9; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🗺️ Quiz Geografia: Colonização das Américas</h1>
            <p>Teste seus conhecimentos!</p>
            
            <!-- QR Code aqui -->
            <div class="qr-container">
                <p><strong>📱 Escaneie para acessar no celular:</strong></p>
                <img id="qrcode" src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://seu-usuario.github.io/quiz-geografia-colonizacao/quiz-geografia-colonizacao.html" 
                     alt="QR Code do Quiz" style="border: 3px solid #0ea5e9; border-radius: 12px;">
            </div>
        </header>

        <div id="quiz-screen">
            <div class="quiz-area">
                <div class="progress">Pergunta <span id="current">1</span> de 10</div>
                <div class="question" id="question-text">Carregando pergunta...</div>
                <div class="options" id="options"></div>
                <button class="next-btn" id="next-btn" disabled onclick="nextQuestion()">Próxima pergunta →</button>
            </div>
        </div>

        <div id="result-screen" class="result" style="display: none;">
            <h2>Você terminou o quiz! 🎉</h2>
            <div class="score" id="score">0/10</div>
            <p id="feedback"></p>
            <div class="review" id="review"></div>
